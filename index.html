<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inklings">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fefdf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Inklings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* VOICE everyday game, playful but calm, like a puzzle scribbled in a notebook margin
   IDEA a page of ruled notebook paper; tiles are hand cut cards, solved groups get swiped with highlighter
   PICTURE the 4 by 4 board itself, top of the first screen under a small handwritten title
   COLOUR bright paper with faint blue rules, near black ink, blue ballpoint for selection, red pen for notes, four highlighters
   TYPE Caveat for headings and notes, Kalam bold for tiles and buttons
   LAYOUT one centred column up to 540px; title row, board, mistakes and look up, buttons; same order on a phone */
:root{color-scheme:light dark;--bg:light-dark(#fefdf9,#1a1916);--line:light-dark(#dde8f5,#2a2c30);--margin:light-dark(#f3b6b0,#5a2a27);--ink:light-dark(#141310,#f8f4ea);--soft:light-dark(#47433b,#cfc8ba);--pen:light-dark(#1a3a9c,#b4c6ff);--red:light-dark(#c3311f,#ff9585);--card:light-dark(#ffffff,#26241f);--h0:#ffe45c;--h1:#a8e870;--h2:#86cffc;--h3:#f9a0d2;--hi:#121110}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);color:var(--ink);font:17px/1.5 Kalam,"Comic Sans MS",cursive;overflow-x:clip}
body::before{content:"";position:fixed;top:0;bottom:0;left:max(3vw,22px);width:2px;background:var(--margin);pointer-events:none}
main{max-width:540px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 24px;min-height:100%;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{line-height:1}
h1{font:700 clamp(42px,10vw,52px)/1 Caveat,cursive;margin:0;letter-spacing:-.01em}
.brand svg{display:block;width:118px;height:12px;margin-top:-2px}
nav{display:flex;align-items:center;gap:2px}
.nb{appearance:none;background:none;border:0;color:var(--ink);font:700 30px/1 Kalam,cursive;min-width:44px;min-height:44px;padding:0 8px;border-radius:12px;cursor:pointer}
.nb.pg{font:700 24px/1 Caveat,cursive;color:var(--pen);text-decoration:underline wavy color-mix(in srgb,var(--pen) 50%,transparent);text-underline-offset:5px;white-space:nowrap}
.nb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.nb:focus-visible,.tile:focus-visible,.btn:focus-visible,.pb:focus-visible,.look:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.sub{margin:-6px 0 0;color:var(--soft);font-size:17px}
.sub b{color:var(--pen)}
.board{position:relative;display:grid;gap:8px}
#rows,#grid{display:grid;gap:8px}
#grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{appearance:none;position:relative;border:2px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:var(--card);color:var(--ink);font:700 18px/1.05 Kalam,cursive;text-transform:uppercase;height:clamp(68px,19vw,84px);padding:4px 2px;display:grid;place-items:center;text-align:center;rotate:var(--r);transition:background .12s,color .12s,scale .12s,border-color .12s;cursor:pointer;overflow:hidden;box-shadow:2px 3px 0 color-mix(in srgb,var(--ink) 18%,transparent);-webkit-tap-highlight-color:transparent}
.tile span{display:block;width:100%;overflow-wrap:normal;word-break:keep-all;letter-spacing:-.01em}
.tile:hover{background:color-mix(in srgb,var(--pen) 7%,var(--card))}
.tile:active{scale:.95}
.tile[aria-pressed=true]{background:var(--pen);border-color:var(--pen);color:var(--card);rotate:calc(var(--r) * -1);box-shadow:3px 4px 0 color-mix(in srgb,var(--pen) 30%,transparent)}
.looking .tile{border-style:dashed;border-color:var(--pen)}
.looking .tile[aria-pressed=true]{border-style:solid}
.tile.peek{outline:3px solid var(--red);outline-offset:2px}
.tile.hop{animation:hop .34s ease-out}
.tile.shake{animation:shake .4s ease-in-out}
@keyframes hop{0%,100%{translate:0 0}45%{translate:0 -10px}}
@keyframes shake{20%{translate:-7px 0}40%{translate:7px 0}60%{translate:-4px 0}80%{translate:4px 0}}
.row{min-height:clamp(68px,19vw,84px);display:grid;place-content:center;text-align:center;padding:8px 12px;color:var(--hi);border-radius:4px 16px 6px 14px/14px 6px 16px 4px;rotate:-.35deg;line-height:1.2}
.row:nth-child(even){rotate:.3deg}
.row b{font:700 19px/1.15 Kalam,cursive}
.row span{font:400 17px/1.25 Kalam,cursive;text-transform:uppercase}
.h0{background:var(--h0)}.h1{background:var(--h1)}.h2{background:var(--h2)}.h3{background:var(--h3)}
.row.new{animation:swipe .55s cubic-bezier(.3,.7,.3,1) both}
@keyframes swipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.note{position:absolute;left:50%;top:-20px;translate:-50% 0;rotate:-3deg;z-index:3;font:700 28px/1 Caveat,cursive;color:var(--red);background:var(--bg);padding:2px 12px;border-radius:10px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .2s}
.note.on{opacity:1}
.slip{background:var(--card);border:2px solid var(--pen);border-radius:6px 16px 8px 14px/14px 8px 16px 6px;padding:10px 14px 12px;box-shadow:3px 4px 0 color-mix(in srgb,var(--pen) 22%,transparent);rotate:-.4deg}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sw b{font:700 30px/1 Caveat,cursive;color:var(--pen)}
.sw .nb{font-size:26px;min-height:36px}
.slip p{margin:2px 0 0;font-size:17px;line-height:1.45}
.slip i{color:var(--soft);margin-right:6px}
.mist{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--soft)}
.ml{display:flex;align-items:center;gap:12px}
#dots{display:flex;gap:10px}
.dot{width:16px;height:16px;border:2px solid var(--ink);border-radius:50% 44% 56% 48%;position:relative}
.dot.gone{border-color:var(--soft)}
.dot.gone::before,.dot.gone::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:2.5px;background:var(--red);border-radius:2px;translate:-50% -50%;rotate:42deg}
.dot.gone::after{rotate:-38deg}
.mr{display:flex;align-items:center;gap:10px}
.coin{appearance:none;position:absolute;left:60px;top:65px;z-index:2;width:46px;height:46px;padding:0;border-radius:50%;border:3px solid #9a6e10;background:radial-gradient(circle at 34% 30%,#fff0b8,#e0a526 55%,#b07c14);display:grid;place-items:center;cursor:pointer;box-shadow:2px 3px 0 color-mix(in srgb,var(--ink) 25%,transparent);transition:opacity .15s}
.coin svg{width:24px;height:24px}
.coin[aria-disabled=true]{display:none}
.coin.ready{animation:coinr 1.1s ease-in-out infinite alternate}
@keyframes coinr{to{transform:rotate(16deg) scale(1.08)}}
.coin.flip{animation:cflip .9s ease-in-out}
@keyframes cflip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-28px)}100%{transform:rotateY(1800deg) translateY(0)}}
.nah{position:fixed;inset:0;display:grid;place-items:center;place-content:center;padding:0 3vw;text-align:center;pointer-events:none;z-index:20;font:400 clamp(110px,36vw,230px)/.95 "Permanent Marker",Impact,sans-serif;color:#e3271a;-webkit-text-stroke:.035em #141310;paint-order:stroke fill;text-shadow:.045em .045em 0 #141310;letter-spacing:-.02em;rotate:-9deg;opacity:0;overflow-wrap:normal}
.nah.on{animation:nah 1.7s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes nah{0%{opacity:0;transform:scale(3.2) rotate(-18deg)}10%{opacity:1;transform:scale(.88) rotate(-4deg)}15%{transform:scale(1.08) rotate(2deg)}20%{transform:translate(-8px,4px)}25%{transform:translate(8px,-5px)}30%{transform:translate(-6px,-3px)}35%{transform:translate(5px,5px)}40%{transform:translate(0,0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.jolt{animation:jolt .45s linear}
@keyframes jolt{15%{transform:translate(-10px,6px) rotate(-.6deg)}30%{transform:translate(9px,-7px) rotate(.5deg)}45%{transform:translate(-7px,-4px)}60%{transform:translate(6px,5px)}80%{transform:translate(-3px,2px)}}
#blfig .w1,#blfig .w2,#blfig .w3{transform-box:fill-box;transform-origin:center;animation:whyp 2.4s ease-out infinite;opacity:0}
#blfig .w2{animation-delay:.6s}#blfig .w3{animation-delay:1.2s}
@keyframes whyp{0%{opacity:0;scale:.4}10%{opacity:1;scale:1.15}16%{scale:1}80%{opacity:1}100%{opacity:0;scale:1}}
.coin:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.tile.odd{outline:3px solid var(--red);outline-offset:2px}
.tile.gold{outline:3px solid #e0a526;outline-offset:2px;background:color-mix(in srgb,#e0a526 22%,var(--card))}
.tile.x{opacity:.4;text-decoration:line-through 3px var(--red)}
.tile.x[aria-pressed=true]{opacity:.75}
.look{appearance:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border:2px dashed var(--pen);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;background:transparent;color:var(--pen);font:700 16px/1 Kalam,cursive;cursor:pointer}
.look svg{width:20px;height:20px}
.look[aria-pressed=true]{background:var(--pen);color:var(--card);border-style:solid}
.ctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{appearance:none;min-height:48px;padding:0 20px;border:2px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;background:transparent;color:var(--ink);font:700 17px/1 Kalam,cursive;cursor:pointer;transition:background .12s,opacity .12s}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn.primary:not(:disabled){background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
#end{display:grid;justify-items:center;gap:10px;text-align:center;padding:6px 0}
#end h2{font:700 clamp(42px,11vw,54px)/1 Caveat,cursive;margin:0;color:var(--pen);rotate:-2deg}
#end p{margin:0;color:var(--soft)}
#mini{display:grid;gap:5px;margin:4px 0 6px}
.mrow{display:flex;gap:5px}
.mrow i{width:26px;height:20px;border-radius:3px 7px 4px 6px}
.msg{text-align:center;color:var(--soft);padding:40px 0}
.tmr{font:700 1.15em/1 Caveat,cursive;color:var(--pen);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{margin-top:auto;text-align:center;color:var(--soft);font-size:14px}
.sheet{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(3px)}
.panel{width:min(460px,100%);max-height:90%;overflow:auto;background:var(--card);border:2px solid var(--ink);border-radius:18px 6px 20px 8px/8px 20px 6px 18px;padding:16px 18px 20px;box-shadow:4px 6px 0 color-mix(in srgb,var(--ink) 18%,transparent);display:grid;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h2{font:700 32px/1 Caveat,cursive;margin:0}
.panel h3{font:700 16px/1.2 Kalam,cursive;margin:0;color:var(--soft)}
.pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.pb{appearance:none;position:relative;height:50px;border:2px solid color-mix(in srgb,var(--ink) 60%,transparent);border-radius:14px 5px 12px 6px/6px 12px 5px 14px;background:transparent;color:var(--ink);font:700 21px/1 Caveat,cursive;cursor:pointer;padding:0 2px}
.pb.day{font-size:17px}
.pb.mid{border-style:dashed;border-color:var(--pen);color:var(--pen)}
.pb.won{background:var(--pen);border-color:var(--pen);color:var(--card)}
.pb.lost{color:var(--soft)}
.pb.lost::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:2.5px;background:var(--red);rotate:-14deg}
.pb.cur{outline:2.5px solid var(--red);outline-offset:2px}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--soft);font-size:14px}
.key i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border-radius:4px;border:2px solid var(--pen)}
.key .k1{border-style:dashed}.key .k2{background:var(--pen)}
.stage{position:relative;height:128px;margin:-4px 0 -6px}
.stage::after{content:"";position:absolute;left:0;right:0;top:115px;height:2.5px;border-radius:2px;background:var(--ink)}
#bl{position:absolute;right:2px;top:0;width:76px;height:128px;overflow:visible;z-index:1;--glow:light-dark(transparent,rgba(248,244,234,.24));background:radial-gradient(ellipse 62% 48% at 50% 52%,var(--glow),transparent 72%)}
#blmv{transform-box:view-box;transform-origin:100px 284px}
.gun{position:absolute;left:0;top:66px;min-width:44px;height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 4px;border:0;border-radius:10px;background:none;color:var(--ink);font:700 22px/1 Caveat,cursive;cursor:pointer;z-index:2}
.gun:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.gun:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.gun svg{width:42px;height:30px}.gun .ti{display:none;width:34px;height:38px}.gun.dead .gi{display:none}.gun.dead .ti{display:block}.gun.dead:hover .ti{animation:bwiggle .5s ease-in-out}@keyframes bwiggle{25%{rotate:-6deg}75%{rotate:6deg}}
.stage.off{height:44px}
.stage.off::after,.stage.off #bl{display:none}
.stage.off .gun{top:0}
.stage.off .coin{top:0}
.m-gone{animation:bgone .6s ease-in forwards}
@keyframes bgone{30%{transform:rotate(-14deg) scale(1.05)}100%{transform:scale(1.3,0);opacity:0}}
.m-bob{animation:bbob .45s ease-in-out infinite alternate}.m-sway{animation:bsway .9s ease-in-out infinite alternate}.m-shake{animation:bshake .12s linear infinite alternate}.m-bounce{animation:bbounce .35s ease-in-out infinite alternate}.m-wiggle{animation:bwig .2s ease-in-out infinite alternate}.m-float{animation:bfloat 1.6s ease-in-out infinite alternate}.m-pulse{animation:bpulse .5s ease-in-out infinite alternate}.m-melt{animation:bmelt 1.2s ease-in-out infinite alternate}.m-stretch{animation:bstretch .8s ease-in-out infinite alternate}.m-spin{animation:bspin .6s ease-in-out infinite}
@keyframes bbob{to{transform:scale(1.03,.95)}}@keyframes bsway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}@keyframes bshake{from{transform:translateX(-3px)}to{transform:translateX(3px)}}@keyframes bbounce{to{transform:translateY(-8px) scale(.98,1.03)}}@keyframes bwig{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}@keyframes bfloat{to{transform:translateY(-4px)}}@keyframes bpulse{to{transform:scale(1.06)}}@keyframes bmelt{to{transform:scale(1.04,.9)}}@keyframes bstretch{to{transform:scale(.95,1.06)}}@keyframes bspin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@media(min-width:600px){main{padding-top:30px}}
@media(max-width:600px){body::before{left:8px;width:1.5px;opacity:.6}}
@media(prefers-reduced-motion:reduce){.tile.hop,.tile.shake,.row.new,#blmv,.coin.ready,.coin.flip,.jolt{animation:none}.nah.on{animation:none;opacity:1}#blfig .w1,#blfig .w2,#blfig .w3{animation:none;opacity:1}.tile,.btn{transition:none}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <h1>Inklings</h1>
    <svg viewBox="0 0 120 12" aria-hidden="true"><path d="M3 8 C 20 2, 34 11, 52 6 S 88 1, 117 7" fill="none" stroke="var(--pen)" stroke-width="3" stroke-linecap="round"/></svg>
  </div>
  <nav>
    <button class="nb" id="prev" aria-label="Previous page">&lsaquo;</button>
    <button class="nb pg" id="pg">loading</button>
    <button class="nb" id="nextp" aria-label="Next page">&rsaquo;</button>
  </nav>
</header>
<div class="stage" id="stage"><button class="gun" id="gun" aria-label="Remove Blurbo"><svg class="gi" viewBox="0 0 42 30" aria-hidden="true"><path d="M6 9 h27 a3 3 0 0 1 3 3 v2 a3 3 0 0 1 -3 3 h-14 l-4 10 h-7 l3 -10 h-5 a2 2 0 0 1 -2 -2 v-4 a2 2 0 0 1 2 -2 z" fill="var(--card)" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"></path><path d="M19 17 c0 4 3 5 6 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><rect x="36" y="10.5" width="5" height="5" rx="1.5" fill="#e0a526" stroke="currentColor" stroke-width="1.6"></rect></svg><svg class="ti" viewBox="0 0 34 38" aria-hidden="true"><path d="M2 36 h30" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path><path d="M6 35 V14 a11 11 0 0 1 22 0 V35 z" fill="var(--card)" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"></path><path d="M17 9 c3 4 5 7 5 10 a5 5 0 0 1 -10 0 c0 -3 2 -6 5 -10 z" fill="currentColor"></path><path d="M11 27 h12 M13 31 h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"></path><path d="M3 36 l1.5 -4 l1.5 4 M28 36 l1.5 -4 l1.5 4" fill="none" stroke="#5aa05e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button class="coin" id="hintbtn" aria-disabled="true" aria-label="Hint coin flip, crosses out half the options when you are one away"><svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="9" fill="none" stroke="#9a6e10" stroke-width="1.4"></circle><path d="M0 -7 L2 -2.2 L6.7 -2.2 L2.9 0.9 L4.3 5.7 L0 2.8 L-4.3 5.7 L-2.9 0.9 L-6.7 -2.2 L-2 -2.2 Z" fill="#8a5f0c"></path></svg></button><svg id="bl" viewBox="0 -24 200 340" aria-hidden="true"><defs id="bldefs"></defs><g id="blmv" class="m-none"><g id="blfig"></g></g></svg></div>
<p class="sub" id="sub">Make four groups of four.</p>

<div class="board">
  <div class="note" id="note" role="status" aria-live="polite"></div>
  <div id="rows"></div>
  <div id="grid"><p class="msg" style="grid-column:1/-1">Opening the notebook…</p></div>
</div>

<div class="slip" id="slip" hidden aria-live="polite">
  <div class="sw"><b id="slipW"></b><button class="nb" id="slipX" aria-label="Close definition">&times;</button></div>
  <p><i id="slipP"></i><span id="slipD"></span></p>
</div>

<section id="play" class="board" style="gap:14px">
  <div class="mist">
    <div class="ml"><span>Mistakes left</span><div id="dots"></div></div>
    <div class="mr">
    <button class="look" id="look" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5c3-1.4 6-1.4 9 .6 3-2 6-2 9-.6V19c-3-1.3-6-1.3-9 .6-3-1.9-6-1.9-9-.6z M12 6.1V19.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Look up</button></div>
  </div>
  <div class="ctl">
    <button class="btn" id="shuf">Shuffle</button>
    <button class="btn" id="desel">Deselect all</button>
    <button class="btn primary" id="sub2">Submit</button>
  </div>
</section>

<section id="end" hidden>
  <h2 id="endT"></h2>
  <p id="endS"></p>
  <div id="mini"></div>
  <p class="nx" style="font-size:19px;color:var(--ink)">Next page in <b class="tmr">--:--:--</b></p>
  <div class="ctl">
    <button class="btn" id="copy">Copy results</button>
    <button class="btn primary" id="next">Next page</button>
  </div>
</section>

<footer id="foot"><span class="nx">Next page in <b class="tmr">--:--:--</b></span><br>Your progress saves in this browser.</footer>
</main>

<div class="nah" id="nah" aria-live="assertive"></div>
<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="All pages">
    <div class="ph"><h2>All pages</h2><button class="nb" id="close" aria-label="Close">&times;</button></div>
    <h3 id="dH">Daily pages</h3>
    <div class="pgs" id="days"></div>
    <h3>The first notebook</h3>
    <div class="pgs" id="pages"></div>
    <div class="key"><span><i class="k1"></i>started</span><span><i class="k2"></i>solved</span><span>crossed out: ran out of ink</span></div>
    <button class="btn" id="erase">Erase this page and start over</button>
  </div>
</div>

<script>
{
const K="inklings.v1",EMO=["\u{1F7E8}","\u{1F7E9}","\u{1F7E6}","\u{1F7EA}"];
const MISS=["nope","not quite","hmm, no","out of ink"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const pad=n=>String(n).padStart(2,"0");
const now=new Date(),TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
let blOff=false,P=[],S={},cur=0,sel=[],busy=false,revealing=false,looking=false,noteT=0,lastDay="";

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rot=w=>{let h=7;for(const c of w)h=(h*31+c.charCodeAt(0))%997;return ((h%25)-12)/10;};
const G=()=>P[cur].g;
const fresh=i=>({solved:[],mistakes:0,guesses:[],tried:[],order:shuffle(P[i].g.flatMap(g=>g[1])),done:false,won:false});
const st=()=>S[cur]||(S[cur]=fresh(cur));
const lvl=w=>G().findIndex(g=>g[1].includes(w));
const fmt=d=>{const[y,m,dd]=d.split("-").map(Number);return `${MON[m-1]} ${dd}`;};
const label=i=>{const d=P[i].date;return d?(d===TODAY?"today's page":fmt(d)):`page ${P[i].n||i+1}`;};
const save=()=>{try{localStorage.setItem(K,JSON.stringify({S,cur,lastDay,blOff}));}catch(e){}};
const load=()=>{try{const d=JSON.parse(localStorage.getItem(K)||"null");if(d&&d.S){S=d.S;cur=d.cur||0;lastDay=d.lastDay||"";blOff=!!d.blOff;}}catch(e){}};
const tileOf=w=>document.querySelector(`.tile[data-w="${CSS.escape(w)}"]`);

function note(t){const n=$("#note");n.textContent=t;n.classList.add("on");clearTimeout(noteT);noteT=setTimeout(()=>n.classList.remove("on"),1500);}

function fit(){
  document.querySelectorAll(".tile span").forEach(s=>{
    s.style.fontSize="";let f=parseFloat(getComputedStyle(s).fontSize);const t=s.parentNode;
    while((s.scrollWidth>s.clientWidth+1||s.offsetHeight>t.clientHeight-6)&&f>11){f-=.5;s.style.fontSize=f+"px";}
  });
}

function hintOk(){const s=P.length&&st();return !!s&&!s.done&&!busy&&s.near!=null&&!s.solved.includes(s.near);}
function updCoin(){const ok=hintOk(),c=$("#hintbtn");c.setAttribute("aria-disabled",String(!ok));c.classList.toggle("ready",ok);}
function updBtns(){
  $("#sub2").disabled=sel.length!==4||busy;
  $("#desel").disabled=!sel.length||busy;
  $("#shuf").disabled=busy;
  updCoin();
}

function setLook(on){
  looking=on;document.body.classList.toggle("looking",on);
  $("#look").setAttribute("aria-pressed",String(on));
  $("#sub").innerHTML=on?"<b>Tap any word</b> to see what it means.":"Make four groups of four.";
  if(!on){$("#slip").hidden=true;document.querySelectorAll(".tile.peek").forEach(t=>t.classList.remove("peek"));}
  if(BL&&P.length&&!busy)rest();
}

function showDef(w){
  const d=(P[cur].d||{})[w];
  $("#slipW").textContent=w.toLowerCase();
  $("#slipP").textContent=d?d[0]:"";
  $("#slipD").textContent=d?d[1]:"No entry for this one yet.";
  $("#slip").hidden=false;
  document.querySelectorAll(".tile.peek").forEach(t=>t.classList.remove("peek"));
  const t=tileOf(w);if(t)t.classList.add("peek");
}

function render(newL){
  const s=st(),g=G();
  $("#pg").textContent=label(cur);
  $("#rows").innerHTML=s.solved.map(l=>`<div class="row h${l}${l===newL?" new":""}"><b>${esc(g[l][0])}</b><span>${g[l][1].map(esc).join(", ")}</span></div>`).join("");
  const gone=new Set(s.solved.flatMap(l=>g[l][1]));
  const xs=new Set(Object.entries(s.cross||{}).filter(([l])=>!s.solved.includes(+l)).flatMap(([,ws])=>ws));
  $("#grid").innerHTML=s.order.filter(w=>!gone.has(w)).map(w=>`<button class="tile${xs.has(w)?" x":""}" data-w="${esc(w)}" aria-pressed="${sel.includes(w)}" style="--r:${rot(w)}deg"><span>${esc(w)}</span></button>`).join("");
  $("#dots").innerHTML=[0,1,2,3].map(i=>`<i class="dot${i<s.mistakes?" gone":""}"></i>`).join("");
  $("#play").hidden=s.done;
  $("#end").hidden=!s.done||revealing;
  if(s.done){setLook(false);if(!revealing)endCard(s);}
  updBtns();
  requestAnimationFrame(fit);
}

function endCard(s){
  const m=s.mistakes;
  const h=s.hints||0;
  $("#endT").textContent=s.won?(h&&m===0?"nice work":["flawless","nice work","got there","phew, close one"][m]):"tough page";
  $("#endS").textContent=(s.won?(m===0?"No mistakes.":m===1?"1 mistake.":`${m} mistakes.`):"The answers are filled in above.")+(h?(h===1?" 1 hint used.":` ${h} hints used.`):"");
  $("#mini").innerHTML=s.guesses.map(r=>r[0]==="c"?`<div class="mrow hint">${[0,1,2,3].map(()=>`<i class="h${r[1]}"></i>`).join("")}</div>`:`<div class="mrow">${r.map(l=>`<i class="h${l}"></i>`).join("")}</div>`).join("");
  $("#next").textContent=cur<P.length-1?"Next page":"Back to page 1";
}

async function submit(){
  if(sel.length!==4||busy)return;
  const s=st(),key=sel.slice().sort().join("|");
  if(s.tried.includes(key)){note("already tried that");return;}
  busy=true;updBtns();setLook(false);
  s.tried.push(key);
  const lv=sel.map(lvl);s.guesses.push(lv);
  const els=sel.map(tileOf);
  els.forEach((t,i)=>setTimeout(()=>t&&t.classList.add("hop"),reduce?0:i*90));
  await sleep(90*3+360);
  if(lv.every(x=>x===lv[0])){
    s.near=null;s.cheat=false;s.solved.push(lv[0]);sel=[];
    if(s.solved.length===4){s.done=true;s.won=true;}
    save();render(lv[0]);
    if(s.won){note(s.mistakes?"solved":"perfect");dance();}else emote("correct",1800);
  }else{
    els.forEach(t=>{if(t){t.classList.remove("hop");t.classList.add("shake");}});
    await sleep(420);
    els.forEach(t=>t&&t.classList.remove("shake"));
    s.mistakes++;
    const left=[0,1,2,3].filter(l=>!s.solved.includes(l));
    const nl=left.find(l=>lv.filter(x=>x===l).length===3);const near=nl!==undefined;
    s.near=near?nl:null;s.nearSel=near?sel.slice():null;
    if(s.mistakes>=4){
      note(MISS[3]);s.done=true;s.won=false;s.cheat=false;sel=[];save();emote("lose");
      revealing=true;render();
      for(const l of left){await sleep(650);s.solved.push(l);save();render(l);}
      revealing=false;render();
    }else{
      note(near?"one away!":MISS[s.mistakes-1]);save();render();emote(near?"oneaway":"wrong",2200);
    }
  }
  busy=false;updBtns();
}


// ---------- Blurbo
let BL=null,blT=0,blDance=0,blIdle=0,blClip=0;const blLast={};
async function loadBl(){
  try{const r=await fetch("blurbo.json",{cache:"no-store"});if(!r.ok)throw 0;BL=await r.json();$("#bldefs").innerHTML=BL.defs||"";}
  catch(e){BL=null;$("#stage").hidden=true;}
}
function pickV(list,key){
  if(!list||!list.length)return null;
  if(list.length===1)return list[0];
  let v;do{v=list[Math.floor(Math.random()*list.length)];}while(v.id===blLast[key]);
  blLast[key]=v.id;return v;
}
function blShow(svg,motion){
  $("#blfig").innerHTML=svg||"";
  const ok=BL&&BL.motions&&BL.motions.includes(motion);
  $("#blmv").setAttribute("class","m-"+(ok?motion:"none"));
}
function stopDance(){clearTimeout(blDance);blDance=0;}
function emote(key,hold){
  if(!BL||!BL.emotes||blOff||blClip)return;
  stopDance();clearTimeout(blT);
  const v=pickV(BL.emotes[key],key)||pickV(BL.emotes.idle,"idle");
  if(!v)return;
  blShow(v.svg,v.motion);
  if(hold)blT=setTimeout(rest,hold);
}
function rest(){
  if(!BL||!P.length||blOff)return;
  const s=st();
  if(s.done){if(s.won){if(!blDance)dance();}else emote("lose");return;}
  if(s.cheat){emote("cheat");return;}
  if(looking){emote("look");return;}
  emote(["idle","pick1","pick2","pick3","pick4"][sel.length]||"idle");
}
function dance(){
  if(!BL||!BL.dances||!BL.dances.length||blOff||blClip)return;
  stopDance();clearTimeout(blT);
  let d=pickV(BL.dances,"dance"),i=0;
  const step=()=>{
    if(!d||!d.steps||!d.steps.length)return;
    const f=d.steps[i%d.steps.length];blShow(f.svg,f.motion);i++;
    if(i>=d.steps.length*3){i=0;d=pickV(BL.dances,"dance");}
    blDance=setTimeout(step,Math.max(200,f.ms||500));
  };
  step();
}
function playClip(c,done){
  clearTimeout(blClip);blClip=0;stopDance();clearTimeout(blT);
  if(!c||!c.steps||!c.steps.length){done&&done();return;}
  let i=0;
  const step=()=>{
    if(i>=c.steps.length){blClip=0;done&&done();return;}
    const f=c.steps[i++];blShow(f.svg,f.motion);
    blClip=setTimeout(step,Math.max(150,f.ms||400));
  };
  step();
}
function setBl(off,anim){
  blOff=off;const sg=$("#stage");
  const gn=$("#gun");gn.setAttribute("aria-label",off?"Revive Blurbo":"Remove Blurbo");gn.classList.toggle("dead",off);
  if(off){
    stopDance();clearTimeout(blT);
    const fall=anim&&!reduce&&BL&&BL.falls&&BL.falls.length?pickV(BL.falls,"fall"):null;
    if(fall)playClip(fall,()=>{if(blOff)sg.classList.add("off");});
    else if(anim&&!reduce){clearTimeout(blClip);blClip=0;$("#blmv").setAttribute("class","m-gone");setTimeout(()=>{if(blOff)sg.classList.add("off");},650);}
    else{clearTimeout(blClip);blClip=0;sg.classList.add("off");}
  }else{
    sg.classList.remove("off");
    const rise=anim&&!reduce&&BL&&BL.rises&&BL.rises.length?pickV(BL.rises,"rise"):null;
    if(rise)playClip(rise,()=>{if(!blOff)rest();});
    else{clearTimeout(blClip);blClip=0;rest();}
  }
}
function tick(){
  const n=new Date(),t=new Date(n);t.setHours(24,0,0,0);
  const left=Math.floor((t-n)/1000),h=Math.floor(left/3600),m=Math.floor(left%3600/60),sec=left%60;
  const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()),today=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  document.querySelectorAll(".nx").forEach(e=>{
    if(today!==TODAY){e.textContent="A new page is landing. Reopen in a few minutes.";}
    else{const b=e.querySelector(".tmr");if(b)b.textContent=`${pad(h)}:${pad(m)}:${pad(sec)}`;}
  });
}
function poke(){
  clearTimeout(blIdle);
  blIdle=setTimeout(()=>{if(BL&&!busy&&P.length&&!st().done&&!looking&&!sel.length)emote("escape",3200);poke();},16000);
}

async function useHint(){
  if(busy||!P.length)return;
  const s=st();
  if(!hintOk()){note(s.done?"page is done":"only when one away");return;}
  busy=true;updBtns();setLook(false);
  emote("hint");
  const c=$("#hintbtn");
  if(!reduce){c.classList.add("flip");await sleep(900);c.classList.remove("flip");}
  if(Math.random()<.5){
    s.near=null;s.nearSel=null;s.cheat=true;save();
    const n=$("#nah"),mn=document.querySelector("main");
    const pool=BL&&Array.isArray(BL.nahs)&&BL.nahs.length?BL.nahs.map((t,i)=>({id:String(i),t:String(t)})):[{id:"0",t:"NAH"}];
    const pk=pickV(pool,"nah")||pool[0],lw=Math.max(3,...pk.t.split(/\s+/).map(w=>w.length));
    n.style.fontSize=`min(230px,${Math.min(36,92/(lw*.68)).toFixed(1)}vw)`;n.textContent=pk.t;n.classList.remove("on");mn.classList.remove("jolt");void n.offsetWidth;n.classList.add("on");
    setTimeout(()=>mn.classList.add("jolt"),170);
    setTimeout(()=>{n.classList.remove("on");n.textContent="";mn.classList.remove("jolt");},1700);
    busy=false;emote("cheat");updBtns();return;
  }
  const l=s.near,g=G()[l][1],was=s.nearSel||[];
  const solvedW=new Set(s.solved.flatMap(k=>G()[k][1]));
  const opts=s.order.filter(w=>!solvedW.has(w)&&!was.includes(w));
  const wrong=shuffle(opts.filter(w=>!g.includes(w))).slice(0,Math.floor(opts.length/2));
  s.cross=s.cross||{};s.cross[l]=(s.cross[l]||[]).concat(wrong);
  s.hints=(s.hints||0)+1;s.near=null;s.nearSel=null;s.cheat=true;save();
  note("50/50!");
  for(const w of wrong){const t=tileOf(w);if(t)t.classList.add("x");await sleep(90);}
  busy=false;emote("cheat");updBtns();
}
function go(i){cur=(i+P.length)%P.length;sel=[];setLook(false);save();render();stopDance();rest();}

function pb(i){const s=S[i];const c=s&&s.done?(s.won?"won":"lost"):(s&&s.guesses.length?"mid":"");const d=P[i].date;return `<button class="pb ${c}${d?" day":""}${i===cur?" cur":""}" data-i="${i}" aria-label="${esc(label(i))}">${d?esc(d===TODAY?"today":fmt(d)):esc(P[i].n||i+1)}</button>`;}
function pages(){
  const idx=P.map((_,i)=>i);
  const days=idx.filter(i=>P[i].date).reverse(),old=idx.filter(i=>!P[i].date);
  $("#days").innerHTML=days.map(pb).join("");$("#dH").hidden=$("#days").hidden=!days.length;
  $("#pages").innerHTML=old.map(pb).join("");
}
function openSheet(){pages();$("#sheet").hidden=false;$("#close").focus();}
function closeSheet(){$("#sheet").hidden=true;$("#pg").focus();}

$("#grid").addEventListener("click",e=>{
  const t=e.target.closest(".tile");if(!t||busy||st().done)return;
  const w=t.dataset.w;
  if(looking){showDef(w);return;}
  const i=sel.indexOf(w);
  if(i>=0)sel.splice(i,1);else if(sel.length<4)sel.push(w);else return;
  t.setAttribute("aria-pressed",String(i<0));updBtns();rest();poke();
});
$("#look").addEventListener("click",()=>{setLook(!looking);});
$("#hintbtn").addEventListener("click",useHint);
$("#gun").addEventListener("click",()=>{const off=!blOff;if(off)note("bang!");setBl(off,true);save();});
$("#slipX").addEventListener("click",()=>setLook(false));
$("#sub2").addEventListener("click",submit);
$("#desel").addEventListener("click",()=>{sel=[];document.querySelectorAll(".tile").forEach(t=>t.setAttribute("aria-pressed","false"));updBtns();rest();poke();});
$("#shuf").addEventListener("click",()=>{const s=st();s.order=shuffle(s.order);save();render();});
$("#prev").addEventListener("click",()=>P.length&&go(cur-1));
$("#nextp").addEventListener("click",()=>P.length&&go(cur+1));
$("#next").addEventListener("click",()=>go(cur+1));
$("#pg").addEventListener("click",()=>P.length&&openSheet());
$("#close").addEventListener("click",closeSheet);
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet();const b=e.target.closest(".pb");if(b){go(+b.dataset.i);closeSheet();}});
$("#erase").addEventListener("click",()=>{delete S[cur];sel=[];save();render();closeSheet();note("fresh page");});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#sheet").hidden)closeSheet();else if(looking)setLook(false);}});
$("#copy").addEventListener("click",()=>{
  const s=st(),txt=`Inklings, ${label(cur)}${s.hints?" "+"\u{1FA99}".repeat(s.hints):""}\n`+s.guesses.map(r=>r[0]==="c"?EMO[r[1]].repeat(4)+" \u{1FA99}":r.map(l=>EMO[l]).join("")).join("\n");
  try{navigator.clipboard.writeText(txt).then(()=>note("copied"),()=>note("couldn't copy"));}catch(e){note("couldn't copy");}
});

const ro=new ResizeObserver(()=>fit());ro.observe($("#grid"));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

function pickStart(){
  if(cur>=P.length||cur<0)cur=0;
  const t=P.findIndex(p=>p.date===TODAY);
  if(t>=0&&lastDay!==TODAY){cur=t;lastDay=TODAY;}
  else if(t<0&&!S[cur]){const dated=P.map((p,i)=>p.date?i:-1).filter(i=>i>=0);if(dated.length&&lastDay!==TODAY){cur=dated[dated.length-1];lastDay=TODAY;}}
}
async function start(d){
  if(d&&d.S){S=d.S;cur=d.cur||0;lastDay=d.lastDay||"";blOff=!!d.blOff;}else load();
  try{
    const r=await fetch("puzzles.json",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    P=(await r.json()).filter(p=>p&&Array.isArray(p.g)&&p.g.length===4);
    if(!P.length)throw new Error("empty");
  }catch(e){
    $("#grid").innerHTML=`<p class="msg" style="grid-column:1/-1">Couldn't open the notebook. Try reloading the page.</p>`;
    $("#pg").textContent="";$("#play").hidden=true;return;
  }
  pickStart();save();render();
  await loadBl();if(BL)setBl(blOff,false);rest();poke();
  tick();setInterval(tick,1000);
}
window.claude?.hot?.snapshot?.(()=>({S,cur,lastDay,blOff}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
